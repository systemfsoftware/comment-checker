
[package]
name = "claude-code-comment-checker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Comment checker hook for Claude Code — flags genuinely unnecessary comments, spares justified ones"
repository.workspace = true
keywords = ["comments","tree-sitter","claude-code","hook"]
categories = ["command-line-utilities","development-tools"]

[lib]
name = "claude_code_comment_checker"
path = "src/lib.rs"

[[bin]]
name = "comment-checker"
path = "src/main.rs"

[dependencies]
serde_json = "1"
tree-sitter = "0.27"

[dependencies.clap]
version = "4"
features = ["derive"]

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.tree-sitter-language-pack]
version = "1.20"
default-features = false

[dev-dependencies]
proptest = "1"
serde_json = "1"

[dev-dependencies.serde]
version = "1"
features = ["derive"]

[lints]
workspace = true
