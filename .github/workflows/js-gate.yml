name: JS gate

on:
  workflow_call:

permissions: {}

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-pnpm-node

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2

      - name: Install JS deps (frozen)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build + typecheck (launcher)
        run: pnpm build && pnpm typecheck

      - name: Lint GitHub Actions workflows (issue #9)
        run: ./scripts/tools/lint-workflows.ts

      - name: Release scripts lint + matrix agreement (deno)
        run: |
          cd scripts
          deno task lint
          deno check --config ./deno.jsonc tools/*.ts
          deno task check-matrix
