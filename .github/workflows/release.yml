name: Release

on:
  push:
    branches: [master]
  pull_request:
    types: [closed]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    if: github.event_name == 'push'
    name: version · open release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2

      - name: Consume pending change intents
        run: deno run --allow-read --allow-write scripts/tools/release-version.ts

      - name: Open or update the Release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: deno run --allow-run=gh,git --allow-read --allow-env scripts/tools/create-or-update-release-pr.ts

  release:
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.merged == true
      && github.event.pull_request.head.ref == 'changeset-release/master'
      && github.event.pull_request.user.login == 'github-actions[bot]'
    name: build · ${{ matrix.suffix }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            suffix: linux-x64
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            suffix: linux-arm64
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            suffix: darwin-x64
            runner: macos-14
          - target: aarch64-apple-darwin
            suffix: darwin-arm64
            runner: macos-14
          - target: x86_64-pc-windows-msvc
            suffix: win32-x64
            runner: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@0267444136ce4919088f5eae0461f736f21356de # v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Linux arm64 cross-linker
        if: matrix.target == 'aarch64-unknown-linux-gnu' && matrix.runner == 'ubuntu-latest'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          {
            echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
            echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar"
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
          } >> "$GITHUB_ENV"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2

      - name: "Gate: check-matrix"
        run: deno run --allow-read scripts/tools/check-matrix.ts

      - name: "Gate: binary smoke tests"
        run: deno run --allow-run --allow-read scripts/tools/run-binary-smoke.ts --target ${{ matrix.target }} --bin-dir target/${{ matrix.target }}/release

      - name: Stage platform package
        run: deno run --allow-read --allow-write scripts/tools/stage-platform-package.ts --target ${{ matrix.target }} --suffix ${{ matrix.suffix }} --stage ${{ runner.temp }}/platform-${{ matrix.suffix }} --bin-dir target/${{ matrix.target }}/release

      - name: Bundle tarball
        run: deno run --allow-run=tar --allow-read --allow-write scripts/tools/bundle-release-tarball.ts --target ${{ matrix.target }} --bin-dir target/${{ matrix.target }}/release --out-dir ${{ runner.temp }}/release-tarball-${{ matrix.suffix }}

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.suffix }}
          path: |
            ${{ runner.temp }}/release-tarball-${{ matrix.suffix }}/comment-checker-${{ matrix.target }}.tar.gz
            ${{ runner.temp }}/platform-${{ matrix.suffix }}/binarySha256

      - name: Upload staged platform package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: platform-stage-${{ matrix.suffix }}
          path: ${{ runner.temp }}/platform-${{ matrix.suffix }}
          if-no-files-found: error

  publish:
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.merged == true
      && github.event.pull_request.head.ref == 'changeset-release/master'
      && github.event.pull_request.user.login == 'github-actions[bot]'
    name: publish · oidc · tag
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.21.0

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2

      - name: Preflight — every package must already exist on npm
        run: deno run --allow-net --allow-read scripts/tools/check-publish.ts --preflight

      - name: Build launcher
        run: |
          pnpm install --frozen-lockfile --registry https://registry.npmjs.org
          pnpm -r build

      - name: Sync root version
        run: |
          VERSION="$(jq -r .version npm/packages/comment-checker/package.json)"
          VERSION="$VERSION" deno run --allow-env=VERSION --allow-read --allow-write scripts/tools/sync-root-version.ts

      - name: Publish root launcher
        run: pnpm --filter @systemfsoftware/claude-code-comment-checker publish --provenance --access public --no-git-checks

      - name: Download staged platform packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: platform-stage-*
          path: stages

      - name: Publish platform packages
        run: deno run --allow-run --allow-read scripts/tools/publish-platform-stages.ts

      - name: Tag released packages
        run: deno run --allow-run=git --allow-read scripts/tools/tag-released-packages.ts

      - name: Download platform artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: release-assets

      - name: Create GitHub release with binaries and changelog
        run: deno run --allow-run=git,gh --allow-read --allow-env scripts/tools/create-github-release.ts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
