# Thin caller. The release lifecycle lives in the shared toolchain
# (systemfsoftware/pnpm-release-management); this file supplies only the trigger
# and the permissions. The phase decision, the version bump, the tagging and
# the GitHub Releases all run inside the reusable workflow against release.jsonc.
# tools-ref pins the toolchain revision the release runs from.
name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    uses: systemfsoftware/pnpm-release-management/.github/workflows/release.yml@prm/toolchain
    with:
      tools-ref: prm/toolchain
