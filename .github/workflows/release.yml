name: Release

on:
  push:
    branches: [master]
  pull_request:
    types: [closed]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    if: github.event_name == 'push'
    name: version · open release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          # checkout v5 defaults persist-credentials to false; the release PR
          # branch is pushed with plain git, which needs the stored credential.
          persist-credentials: true

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2

      - name: Consume pending change intents
        run: ./scripts/tools/release-version.ts

      - name: Open or update the Release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/tools/create-or-update-release-pr.ts

  release:
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.merged == true
      && github.event.pull_request.head.ref == 'changeset-release/master'
      && github.event.pull_request.user.login == 'github-actions[bot]'
    name: build · ${{ matrix.suffix }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            suffix: linux-x64
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            suffix: linux-arm64
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            suffix: darwin-x64
            runner: macos-14
          - target: aarch64-apple-darwin
            suffix: darwin-arm64
            runner: macos-14
          - target: x86_64-pc-windows-msvc
            suffix: win32-x64
            runner: windows-2022
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions-rust-lang/setup-rust-toolchain@0267444136ce4919088f5eae0461f736f21356de # v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Linux arm64 cross-linker
        if: matrix.target == 'aarch64-unknown-linux-gnu' && matrix.runner == 'ubuntu-latest'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          {
            echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
            echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar"
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
          } >> "$GITHUB_ENV"

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2

      - name: "Gate: check-matrix"
        run: ./scripts/tools/check-matrix.ts

      - name: "Gate: binary smoke tests"
        run: ./scripts/tools/run-binary-smoke.ts --target ${{ matrix.target }} --bin-dir target/${{ matrix.target }}/release

      - name: Stage platform package
        run: ./scripts/tools/stage-platform-package.ts --target ${{ matrix.target }} --suffix ${{ matrix.suffix }} --stage dist/staging/platform-${{ matrix.suffix }} --bin-dir target/${{ matrix.target }}/release

      - name: Bundle tarball
        run: ./scripts/tools/bundle-release-tarball.ts --target ${{ matrix.target }} --bin-dir target/${{ matrix.target }}/release --out-dir dist/release-tarball-${{ matrix.suffix }}

      - name: Upload artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-${{ matrix.suffix }}
          path: |
            dist/release-tarball-${{ matrix.suffix }}/comment-checker-${{ matrix.target }}.tar.gz
            dist/staging/platform-${{ matrix.suffix }}/binarySha256

      - name: Upload staged platform package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: platform-stage-${{ matrix.suffix }}
          path: dist/staging/platform-${{ matrix.suffix }}
          if-no-files-found: error

  publish:
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.merged == true
      && github.event.pull_request.head.ref == 'changeset-release/master'
      && github.event.pull_request.user.login == 'github-actions[bot]'
    name: publish · oidc · tag
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          # checkout v5 defaults persist-credentials to false; tag-released-packages
          # pushes tags with plain git, which needs the stored credential.
          persist-credentials: true

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6
        with:
          version: 11.21.0

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2

      - name: Preflight — every package must already exist on npm
        run: ./scripts/tools/check-publish.ts --preflight

      - name: Build launcher
        run: |
          pnpm install --frozen-lockfile --registry https://registry.npmjs.org
          pnpm -r build

      - name: Sync root version
        run: ./scripts/tools/sync-root-version.ts

      - name: Publish root launcher
        run: pnpm --filter @systemfsoftware/claude-code-comment-checker publish --provenance --access public --no-git-checks

      - name: Download staged platform packages
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: platform-stage-*
          path: stages

      - name: Publish platform packages
        run: ./scripts/tools/publish-platform-stages.ts

      - name: Tag released packages
        run: ./scripts/tools/tag-released-packages.ts

      - name: Download platform artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: release-*
          path: release-assets

      - name: Create GitHub release with binaries and changelog
        run: ./scripts/tools/create-github-release.ts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
