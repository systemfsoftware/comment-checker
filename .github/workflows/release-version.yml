name: Release Version

on:
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: release-version-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: master

      - name: Install Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2

      - name: Release from change intents
        run: deno run --allow-read=. --allow-write=. --allow-env=GITHUB_TOKEN,GITHUB_REPOSITORY --allow-run=git scripts/tools/release-version.ts