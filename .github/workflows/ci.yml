name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Stock rust-lang toolchain through rustup — the runner image's Cargo
      # 1.97 + rustup, pin-aligned via rust-toolchain. fmt/clippy arrive as
      # registry-installed cargo subcommands (cargo-fmt, cargo-clippy), not
      # rustup components.
      - uses: actions-rust-lang/setup-rust-toolchain@0267444136ce4919088f5eae0461f736f21356de # v1
        with:
          toolchain: stable

      - name: Install cargo subcommands (fmt, clippy)
        run: |
          cargo install cargo-fmt cargo-clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format check
        run: CARGO_BUILD_JOBS=4 cargo fmt --check

      - name: Clippy (deny warnings)
        run: CARGO_BUILD_JOBS=4 cargo clippy --all-targets -- -D warnings

      - name: Test (unit + property + composition + F1)
        run: cargo test --all-targets -- --test-threads=4

  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: denoland/setup-deno@v2

      - name: Install JS deps (frozen)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build + typecheck (launcher)
        run: pnpm build && pnpm typecheck

      - name: Release scripts lint + matrix agreement gate (deno)
        run: |
          cd scripts
          deno task lint
          deno task check-matrix

  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Stock rust-lang toolchain through rustup; cargo-mutants is a
      # registry-installed cargo subcommand (named in the package's list,
      # already published as cargo-mutants 27.1.0).
      - uses: actions-rust-lang/setup-rust-toolchain@0267444136ce4919088f5eae0461f736f21356de # v1
        with:
          toolchain: stable

      - name: Install cargo-mutants subcommand
        run: |
          cargo install cargo-mutants
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # Cargo build state for the miss path. Keyed on the dependency
      # lockfile + toolchain surface; the shared `cargo-` restore prefix
      # also picks up bags the gate job saved under the same namespace.
      - name: Cache cargo build (mutants miss path)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-mut-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Mutation gate (core classifier, 100%)
        run: CARGO_BUILD_JOBS=4 cargo mutants --file crates/comment-checker/src/classify.rs --timeout 90
