name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Stock rust-lang toolchain through rustup with clippy and rustfmt components
      - uses: actions-rust-lang/setup-rust-toolchain@0267444136ce4919088f5eae0461f736f21356de # v1
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Cache cargo build
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Test (unit + property + composition + F1)
        run: cargo test --all-targets -- --test-threads=4

  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6
        with:
          version: 11.21.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - uses: denoland/setup-deno@v2

      - name: Install JS deps (frozen)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build + typecheck (launcher)
        run: pnpm build && pnpm typecheck

      # rhysd/actionlint ships no action.yml -- only a Dockerfile -- so GitHub
      # treats it as an implicit Docker action whose only inputs are
      # entryPoint/args. A `paths:` input is silently discarded, which left this
      # gate linting the container default instead of the files named here.
      # Run the pinned image directly so the arguments are the contract.
      - name: Lint GitHub Actions workflows (issue #9)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            docker.io/rhysd/actionlint@sha256:9d36088643581e728c969f35141f88139fec77280b2be23c1f66f8e40e1025e7 \
            -color .github/workflows/ci.yml .github/workflows/release.yml

      - name: Release scripts lint + matrix agreement gate (deno)
        run: |
          cd scripts
          deno task lint
          deno task check-matrix
  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions-rust-lang/setup-rust-toolchain@0267444136ce4919088f5eae0461f736f21356de # v1
        with:
          toolchain: stable

      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6
        with:
          version: 11.21.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Install cargo-mutants subcommand
        run: |
          cargo install cargo-mutants
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache turbo verdicts
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.toml', 'Cargo.lock', '.cargo/config.toml', 'crates/comment-checker/**', 'package.json', 'turbo.json') }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Cache cargo build (mutants miss path)
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-mut-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Cache pnpm store
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Mutation gate via turbo (core classifier, 100%)
        run: pnpm install --frozen-lockfile && pnpm gate:mutants
