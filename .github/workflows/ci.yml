name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Stock rust-lang toolchain through rustup with clippy and rustfmt components
      - uses: actions-rust-lang/setup-rust-toolchain@0267444136ce4919088f5eae0461f736f21356de # v1
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Test (unit + property + composition + F1)
        run: cargo test --all-targets -- --test-threads=4

  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: denoland/setup-deno@v2

      - name: Install JS deps (frozen)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build + typecheck (launcher)
        run: pnpm build && pnpm typecheck

      - name: Lint GitHub Actions workflows (issue #9)
        uses: rhysd/actionlint@v1.7.12
        with:
          paths: |
            .github/workflows/ci.yml
            .github/workflows/release.yml

      - name: Release scripts lint + tests + matrix agreement (deno)
        run: |
          cd scripts
          deno task lint
          deno task test
          deno task check-matrix

  packaging:
    name: packaging · ${{ matrix.suffix }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            suffix: linux-x64
            runner: ubuntu-latest
            bin: comment-checker
          - target: x86_64-pc-windows-msvc
            suffix: win32-x64
            runner: windows-2022
            bin: comment-checker.exe
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2

      - name: Fixture binary + packaging rehearsal
        shell: bash
        run: |
          mkdir -p \
            "target/${{ matrix.target }}/release" \
            "dist/staging/platform-${{ matrix.suffix }}" \
            "dist/release-tarball-${{ matrix.suffix }}"
          printf '%s\n' fixture > "target/${{ matrix.target }}/release/${{ matrix.bin }}"
          ./scripts/tools/stage-platform-package.ts \
            --target ${{ matrix.target }} \
            --suffix ${{ matrix.suffix }} \
            --stage "dist/staging/platform-${{ matrix.suffix }}" \
            --bin-dir "target/${{ matrix.target }}/release"
          ./scripts/tools/bundle-release-tarball.ts \
            --target ${{ matrix.target }} \
            --bin-dir "target/${{ matrix.target }}/release" \
            --out-dir "dist/release-tarball-${{ matrix.suffix }}"
          archive="dist/release-tarball-${{ matrix.suffix }}/comment-checker-${{ matrix.target }}.tar.gz"
          test -f "$archive"
          tar -tzf "$archive" | grep -Fx "${{ matrix.bin }}"
  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@0267444136ce4919088f5eae0461f736f21356de # v1
        with:
          toolchain: stable

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install cargo-mutants subcommand
        run: |
          cargo install cargo-mutants
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache turbo verdicts
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.toml', 'Cargo.lock', '.cargo/config.toml', 'crates/comment-checker/**', 'package.json', 'turbo.json') }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Cache cargo build (mutants miss path)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-mut-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Mutation gate via turbo (core classifier, 100%)
        run: pnpm install --frozen-lockfile && pnpm gate:mutants
