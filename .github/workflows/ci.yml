name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Toolchain comes from the repo flake (nix develop): cargo, clippy,
      # rustfmt, gcc — same versions as every local dev shell.
      - uses: DeterminateSystems/nix-installer-action@v22

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format check
        run: nix develop -c bash -lc 'CARGO_BUILD_JOBS=4 cargo fmt --check'

      - name: Clippy (deny warnings)
        run: nix develop -c bash -lc 'CARGO_BUILD_JOBS=4 cargo clippy --all-targets -- -D warnings'

      - name: Test (unit + property + composition + F1)
        run: nix develop -c bash -lc 'cargo test --all-targets -- --test-threads=4'

  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: denoland/setup-deno@v2

      - name: Install JS deps (frozen)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build + typecheck (launcher)
        run: pnpm build && pnpm typecheck

      - name: Release scripts lint + matrix agreement gate (deno)
        run: |
          cd scripts
          deno task lint
          deno task check-matrix

  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Toolchain + cargo-mutants from the repo flake — no cargo install.
      - uses: DeterminateSystems/nix-installer-action@v22

      # Turbo verdict cache. The path must mirror turbo.json's `cacheDir`.
      # Keyed on the mutation gate's input set (the same files the mutants
      # task hashes): unchanged inputs restore an exact key, which also
      # suppresses the post-job save; turbo then replays the cached verdict
      # (FULL TURBO) instead of re-running the mutant loop. The restore-key
      # prefix picks up the newest previous bag after any input change.
      - name: Cache turbo verdicts
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('package.json', 'Cargo.toml', 'Cargo.lock', 'flake.lock', '.cargo/config.toml', 'crates/comment-checker/Cargo.toml', 'crates/comment-checker/src/**', 'crates/comment-checker/tests/**') }}
          restore-keys: |
            turbo-${{ runner.os }}-

      # pnpm store: `pnpm install` runs before turbo can replay anything
      # (turbo itself comes from node_modules), so the store is cached to
      # keep that install a fast relink instead of a cold fetch.
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Mutation gate via turbo (core classifier, 100%)
        run: nix develop -c bash -lc 'pnpm install --frozen-lockfile && pnpm mutants'
