name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Toolchain comes from the repo flake (nix develop): cargo, clippy,
      # rustfmt, gcc — same versions as every local dev shell.
      - uses: DeterminateSystems/nix-installer-action@v22

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format check
        run: nix develop -c bash -lc 'CARGO_BUILD_JOBS=4 cargo fmt --check'

      - name: Clippy (deny warnings)
        run: nix develop -c bash -lc 'CARGO_BUILD_JOBS=4 cargo clippy --all-targets -- -D warnings'

      - name: Test (unit + property + composition + F1)
        run: nix develop -c bash -lc 'cargo test --all-targets -- --test-threads=4'

  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: denoland/setup-deno@v2

      - name: Install JS deps (frozen)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build + typecheck (launcher)
        run: pnpm build && pnpm typecheck

      - name: Release scripts lint + matrix agreement gate (deno)
        run: |
          cd scripts
          deno task lint
          deno task check-matrix

  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Toolchain + cargo-mutants from the repo flake — no cargo install.
      - uses: DeterminateSystems/nix-installer-action@v22

      # Turbo verdict cache: content-addressed entries keyed by task inputs.
      # Restore the newest previous save, then save this run's state under a
      # fresh sha key. Unchanged inputs -> turbo replays the cached verdict
      # (FULL TURBO) instead of re-running the mutant loop.
      - name: Cache turbo verdicts
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Mutation gate via turbo (core classifier, 100%)
        run: nix develop -c bash -lc 'pnpm install --frozen-lockfile && pnpm mutants'
