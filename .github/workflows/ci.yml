name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions: {}

jobs:
  gate:
    uses: ./.github/workflows/rust-gate.yml
    permissions:
      contents: read

  npm:
    uses: ./.github/workflows/js-gate.yml
    permissions:
      contents: read

  packaging:
    uses: ./.github/workflows/platform.yml
    with:
      mode: rehearsal
    permissions:
      contents: read

  tools:
    uses: ./.github/workflows/tools.yml
    permissions:
      contents: read

  mutation:
    uses: ./.github/workflows/mutation.yml
    permissions:
      contents: read
