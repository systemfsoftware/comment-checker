name: Tools

on:
  workflow_call:

permissions: {}

jobs:
  tools:
    name: tools · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      # gh does not read GITHUB_TOKEN; check-versions.ts downloads release
      # assets via the gh CLI and needs an explicit GH_TOKEN.
      GH_TOKEN: ${{ github.token }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2

      - name: Shebang tools execute on this runner
        shell: bash
        run: |
          set -euo pipefail
          out="$(./scripts/tools/plan-release.ts)"
          printf '%s\n' "$out"
          grep -q '^phase=' <<<"$out" || {
            echo "shebang invocation produced no output on ${{ matrix.os }}" >&2
            exit 1
          }
          # Same cwd and argv shape as release.yml publish (minus --dry-run).
          sync="$(./scripts/tools/sync-root-version.ts --dry-run)"
          printf '%s\n' "$sync"
          grep -q '^+++' <<<"$sync" || {
            echo "sync-root-version produced no unified patch on ${{ matrix.os }}" >&2
            exit 1
          }
          ./scripts/tools/check-versions.ts
          ./scripts/tools/check-matrix.ts
