name: Setup pnpm then Node
description: >
  pnpm/action-setup must run before setup-node. setup-node@v5 reads
  packageManager and looks up pnpm; reversing the order fails the job.

inputs:
  node-version:
    description: Node version
    required: false
    default: '24'
  registry-url:
    description: npm registry URL for setup-node; omit when empty
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6
      with:
        version: 11.21.0

    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      if: inputs.registry-url == ''
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      if: inputs.registry-url != ''
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: ${{ inputs.registry-url }}
        cache: pnpm
